[project]
name = "swamp"
version = "0.1.0"
description = "A turn-based terminal game for teaching PCA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.scripts]
swamp = "swamp.game:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swamp"]
