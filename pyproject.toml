[project]
name = "swamp"
version = "0.1.0"
description = "Data matrices from a hidden linear world, for teaching PCA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.11",
]

[project.scripts]
swamp = "swamp.data:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swamp"]
